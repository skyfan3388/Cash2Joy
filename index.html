<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash2Joy | 精選貨物展示</title>
  <meta name="description" content="Cash2Joy 精選貨物展示網站，輕鬆瀏覽心水商品並透過 WhatsApp 查詢。" />

  <style>
    :root {
      --bg: #fffaf3;
      --card: #ffffff;
      --text: #2f2f2f;
      --muted: #777777;
      --primary: #ff9f68;
      --primary-dark: #f47b45;
      --secondary: #7dd3c7;
      --soft: #fff1e6;
      --border: #f0dfcf;
      --shadow: 0 10px 30px rgba(60, 38, 20, 0.08);
      --radius: 20px;
      --green: #25d366;
      --danger: #e85d75;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 159, 104, 0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(125, 211, 199, 0.22), transparent 30%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 250, 243, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(240, 223, 207, 0.8);
    }

    .nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.3px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 159, 104, 0.35);
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links a {
      padding: 8px 12px;
      border-radius: 999px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      background: var(--soft);
      color: var(--primary-dark);
    }

    .hero {
      padding: 58px 0 34px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 36px;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 6vw, 4.8rem);
      line-height: 1.05;
      margin-bottom: 18px;
      letter-spacing: -1.5px;
    }

    .hero h1 span {
      color: var(--primary-dark);
    }

    .hero p {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 620px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn {
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      font-size: 0.96rem;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 10px 22px rgba(244, 123, 69, 0.25);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .hero-card-inner {
      min-height: 280px;
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 159, 104, 0.2), rgba(125, 211, 199, 0.25)),
        #fff;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px;
    }

    .hero-card-inner .emoji {
      font-size: 4.3rem;
      margin-bottom: 12px;
    }

    .hero-card-inner h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .hero-card-inner p {
      margin: 0;
      font-size: 0.95rem;
    }

    .toolbar {
      margin: 20px 0 26px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .search-box,
    .filter-box {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      padding: 13px 15px;
      border-radius: 14px;
      outline: none;
      color: var(--text);
      font-size: 0.95rem;
    }

    .search-box:focus,
    .filter-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 159, 104, 0.15);
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
    }

    .section-title p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .products {
      padding-bottom: 70px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 38px rgba(60, 38, 20, 0.12);
    }

.image-slider {
  position: relative;
  aspect-ratio: 4 / 3;
  background: var(--soft);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-slider img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  display: block;
  transition: opacity 0.2s ease;
}

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.86);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: 0.18s;
    }

    .slider-btn:hover {
      background: #fff;
      transform: translateY(-50%) scale(1.06);
    }

    .slider-btn.prev {
      left: 10px;
    }

    .slider-btn.next {
      right: 10px;
    }

    .image-count {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 0.78rem;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .badge {
      position: absolute;
      left: 10px;
      top: 10px;
      background: var(--secondary);
      color: #154a43;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .sold-badge {
      background: var(--danger);
      color: #fff;
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .product-category {
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .product-title {
      font-size: 1.2rem;
      line-height: 1.35;
    }

    .product-desc {
      color: var(--muted);
      font-size: 0.94rem;
      flex: 1;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .price {
      color: var(--primary-dark);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .whatsapp-btn {
      background: var(--green);
      color: #fff;
      box-shadow: 0 8px 18px rgba(37, 211, 102, 0.22);
      padding: 10px 14px;
      font-size: 0.9rem;
    }

    .whatsapp-btn.disabled {
      background: #b8b8b8;
      pointer-events: none;
      box-shadow: none;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.5);
    }

    .back-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      background: var(--primary-dark);
      color: #fff;
      box-shadow: 0 10px 24px rgba(244, 123, 69, 0.32);
      display: none;
      place-items: center;
      font-size: 1.2rem;
      z-index: 40;
    }

    .back-top.show {
      display: grid;
    }

    @media (max-width: 960px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero-card {
        order: -1;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 22px, 1180px);
      }

      .nav {
        height: auto;
        padding: 14px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .hero {
        padding: 34px 0 24px;
      }

      .hero p {
        font-size: 1rem;
      }

      .hero-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .section-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-bottom {
        flex-direction: column;
        align-items: stretch;
      }

      .whatsapp-btn {
        width: 100%;
      }

      .hero-card-inner {
        min-height: 220px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <a href="#" class="brand" aria-label="Cash2Joy 首頁">
        <div class="logo">C2J</div>
        <span>Cash2Joy</span>
      </a>

      <nav class="nav-links" aria-label="主選單">
        <a href="#products">貨物</a>
        <a href="#how-to-buy">查詢方法</a>
        <a href="https://wa.me/" id="topWhatsapp" target="_blank" rel="noopener">WhatsApp</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <p>
            歡迎來到 Cash2Joy。這裡展示我們的精選貨物，你可以瀏覽相片、查看簡介及價錢，
            然後一鍵透過 WhatsApp 查詢心水商品。
          </p>

          <div class="hero-actions">
            <a class="btn btn-primary" href="#products">立即睇貨</a>
            <a class="btn btn-outline" href="#how-to-buy">如何查詢？</a>
          </div>
        </div>
    </section>

    <section class="products" id="products">
      <div class="container">
        <div class="section-title">
          <div>
            <h2>最新貨物</h2>
            <p>可以搜尋標題、簡介或用分類篩選。</p>
          </div>
          <p id="productCount"></p>
        </div>

        <div class="toolbar">
          <input
            id="searchInput"
            class="search-box"
            type="search"
            placeholder="搜尋貨物，例如：手袋、電話、飾物..."
            aria-label="搜尋貨物"
          />

          <select id="categoryFilter" class="filter-box" aria-label="分類篩選">
            <option value="全部">全部分類</option>
          </select>
        </div>

        <div id="productGrid" class="product-grid"></div>

        <div id="emptyState" class="empty">
          找不到相關貨物，可以試試其他關鍵字。
        </div>
      </div>
    </section>

    <section id="how-to-buy" class="products">
      <div class="container">
        <div class="section-title">
          <div>
            <h2>查詢方法</h2>
            <p>
              選擇心水貨物後，按「聯絡我們」會自動打開 WhatsApp，
              並帶上貨物標題、簡介及價錢，方便你直接查詢。
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      © <span id="year"></span> Cash2Joy. All rights reserved.
    </div>
  </footer>

  <button class="back-top" id="backTop" aria-label="返回頂部">↑</button>

  <script>
    /*
      =====================================================
      Cash2Joy 貨物資料區
      =====================================================

      上貨方法：
      1. 將相片放入 images 資料夾
      2. 在下面 products 加一組貨物資料
      3. 每件貨 images 最多放 10 張相
      4. soldOut: true 代表售罄，false 代表有貨

      圖片路徑例子：
      "images/bag1.jpg"
      "images/watch/photo1.png"
    */

    const WHATSAPP_NUMBER = "85257052661";

    const products = [
      {
        title: "JUICY HONEY PLUS #24",
        category: "收藏卡",
        price: "$1380",
        description: "櫻若菜、戀渕桃奈、山岸逢花、金松季步。歐洲傳統洋裝 (Dirndl)以巴伐利亞及阿爾卑斯山地區的傳統少女洋裝為靈感，展現充滿異國古典風情與甜美誘惑的寫真風格。",
        images: [
          "images/JHP24.jpg"
        ],
        soldOut: false
      },
      {
        title: "JUICY HONEY PLUS #26",
        category: "收藏卡",
        price: "$1680",
        description: "白上咲花、miru、戀渕桃奈、小野六花美式啦啦隊 (Cheerleader)女優們換上青春洋溢的藍白美式啦啦隊制服與短裙，將充滿活力的應援動作與極具反差的性感身段完美結合。",
        images: [
          "images/JHP26.jpg"
        ],
        soldOut: false
      },
      {
        title: "JUICY HONEY PLUS #28",
        category: "收藏卡",
        price: "$1680",
        description: "逢澤美優、伊藤舞雪、Julia、淺野心時尚健身服 (Sports/Gym)以運動健美為核心，女優們身穿緊身健身服、瑜珈褲或運動內衣，凸顯經汗水潤飾後的火辣身材與線條美。",
        images: [
          "images/JHP28.jpg"
        ],
        soldOut: true
      },
      {
        title: "JUICY HONEY PLUS #30",
        category: "收藏卡",
        price: "$1680",
        description: "濱邊彌生、miru、神木麗、天神羽衣俏麗護士服 (Nurse & Stockings)此彈以經典的護士服為視覺主軸，並著重於絲襪、吊襪帶等元素，帶來極具挑逗性與角色扮演張力的精美收藏卡。",
        images: [
          "images/JHP30.jpg"
        ],
        soldOut: true
      }
    ];

    /*
      =====================================================
      以下程式一般不用修改
      =====================================================
    */

    const productGrid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const emptyState = document.getElementById("emptyState");
    const productCount = document.getElementById("productCount");
    const backTop = document.getElementById("backTop");
    const topWhatsapp = document.getElementById("topWhatsapp");

    const sliderIndexes = {};

    document.getElementById("year").textContent = new Date().getFullYear();

    topWhatsapp.href = `https://wa.me/${WHATSAPP_NUMBER}`;

    function safeImages(images) {
      if (!Array.isArray(images) || images.length === 0) {
        return ["images/no-image.jpg"];
      }

      return images.slice(0, 10);
    }

    function createWhatsappLink(product) {
      const message = [
        "你好，我想查詢以下貨物：",
        "",
        `標題：${product.title}`,
        `價錢：${product.price}`,
        `簡介：${product.description}`,
        "",
        "請問還有貨嗎？"
      ].join("\n");

      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    function getCategories() {
      const categories = ["全部", ...new Set(products.map(product => product.category || "其他"))];

      categoryFilter.innerHTML = categories
        .map(category => `<option value="${category}">${category}</option>`)
        .join("");
    }

    function renderProducts() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedCategory = categoryFilter.value;

      const filteredProducts = products.filter(product => {
        const matchKeyword =
          product.title.toLowerCase().includes(keyword) ||
          product.description.toLowerCase().includes(keyword) ||
          product.price.toLowerCase().includes(keyword) ||
          product.category.toLowerCase().includes(keyword);

        const matchCategory =
          selectedCategory === "全部" || product.category === selectedCategory;

        return matchKeyword && matchCategory;
      });

      productCount.textContent = `${filteredProducts.length} 件貨物`;

      if (filteredProducts.length === 0) {
        productGrid.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";

      productGrid.innerHTML = filteredProducts.map((product, index) => {
        const images = safeImages(product.images);
        const currentIndex = sliderIndexes[product.title] || 0;
        const currentImage = images[currentIndex] || images[0];
        const whatsappLink = createWhatsappLink(product);

        return `
          <article class="product-card">
            <div class="image-slider">
              <img
                src="${currentImage}"
                alt="${product.title}"
                loading="lazy"
                onerror="this.src='data:image/svg+xml;utf8,${encodeURIComponent(noImageSvg())}'"
              />

              <span class="badge ${product.soldOut ? "sold-badge" : ""}">
                ${product.soldOut ? "售罄" : product.category}
              </span>

              ${images.length > 1 ? `
                <button class="slider-btn prev" onclick="changeImage('${escapeQuote(product.title)}', -1)" aria-label="上一張相">‹</button>
                <button class="slider-btn next" onclick="changeImage('${escapeQuote(product.title)}', 1)" aria-label="下一張相">›</button>
                <span class="image-count">${currentIndex + 1} / ${images.length}</span>
              ` : ""}
            </div>

            <div class="product-info">
              <div class="product-category">${product.category}</div>
              <h3 class="product-title">${product.title}</h3>
              <p class="product-desc">${product.description}</p>

              <div class="product-bottom">
                <div class="price">${product.price}</div>

                <a
                  class="btn whatsapp-btn ${product.soldOut ? "disabled" : ""}"
                  href="${product.soldOut ? "#" : whatsappLink}"
                  target="_blank"
                  rel="noopener"
                  aria-label="透過 WhatsApp 查詢 ${product.title}"
                >
                  ${product.soldOut ? "已售罄" : "聯絡我們"}
                </a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function changeImage(productTitle, direction) {
      const product = products.find(item => item.title === productTitle);
      if (!product) return;

      const images = safeImages(product.images);
      const currentIndex = sliderIndexes[productTitle] || 0;
      let nextIndex = currentIndex + direction;

      if (nextIndex < 0) {
        nextIndex = images.length - 1;
      }

      if (nextIndex >= images.length) {
        nextIndex = 0;
      }

      sliderIndexes[productTitle] = nextIndex;
      renderProducts();
    }

    function escapeQuote(text) {
      return String(text).replace(/'/g, "\\'");
    }

    function noImageSvg() {
      return `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
          <rect width="100%" height="100%" fill="#fff1e6"/>
          <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle"
            font-family="Arial" font-size="34" fill="#f47b45">Cash2Joy</text>
          <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle"
            font-family="Arial" font-size="18" fill="#777777">No Image</text>
        </svg>
      `;
    }

    searchInput.addEventListener("input", renderProducts);
    categoryFilter.addEventListener("change", renderProducts);

    window.addEventListener("scroll", () => {
      if (window.scrollY > 500) {
        backTop.classList.add("show");
      } else {
        backTop.classList.remove("show");
      }
    });

    backTop.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    getCategories();
    renderProducts();
  </script>
</body>
</html>
